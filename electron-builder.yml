appId: com.luprecon.exaone-studio
productName: EXAONE Studio
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: "EXAONE-Studio-${version}-portable.${ext}"
