appId: com.luprecon.exaone-studio
productName: EXAONE Studio
directories:
  output: dist
files:
  - out/**/*
  - build/icon.png
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: "EXAONE-Studio-${version}-portable.${ext}"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: "EXAONE-Studio-${version}-${arch}.${ext}"
